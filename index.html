<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem ele o espaço da barra de gestos do iPhone (env(safe-area-inset-bottom)) vale zero. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Minasflor</title>
    <meta
      name="description"
      content="O Helpoint organiza chamados, prazos e indicadores de TI, Marketing, RH e Qualidade em um único sistema, com cada setor no seu espaço."
    />
    <meta name="author" content="Minasflor" />
    <!-- A barra do celular na cor do fundo do app (rodada 3); era preta sobre um app claro. -->
    <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- Aplicativo (PWA, 2026-10-24): instala pelo navegador; no iPhone, Compartilhar › Adicionar à Tela de Início. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Minasflor" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Minasflor" />
    <meta
      property="og:description"
      content="O Helpoint organiza chamados, prazos e indicadores de TI, Marketing, RH e Qualidade em um único sistema."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minasflor" />
    <meta
      name="twitter:description"
      content="O Helpoint organiza chamados, prazos e indicadores de TI, Marketing, RH e Qualidade em um único sistema."
    />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
