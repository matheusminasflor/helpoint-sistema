<!doctype html>
<html lang="pt-BR">
<body style="font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;margin:0;padding:32px;color:#111">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e6e9ef;border-radius:12px;overflow:hidden">
    <tr><td style="padding:28px 32px 8px">
      <h1 style="margin:0 0 12px;font-size:20px">Confirme seu novo e-mail</h1>
      <p style="margin:0;color:#555;font-size:14px;line-height:1.5">Pediram para trocar o e-mail da sua conta no <b>Helpoint</b> de <b>{{ .Email }}</b> para <b>{{ .NewEmail }}</b>. Confirme para concluir.</p>
    </td></tr>
    <tr><td style="padding:20px 32px 28px">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0073ea;color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:600;font-size:14px">Confirmar novo e-mail</a>
      <p style="margin:24px 0 0;color:#999;font-size:12px;line-height:1.5">Se você não pediu esta troca, ignore esta mensagem: seu e-mail continua o mesmo.</p>
    </td></tr>
  </table>
</body>
</html>
