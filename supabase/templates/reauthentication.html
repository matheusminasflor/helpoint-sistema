<!doctype html>
<html lang="pt-BR">
<body style="font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;margin:0;padding:32px;color:#111">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e6e9ef;border-radius:12px;overflow:hidden">
    <tr><td style="padding:28px 32px 8px">
      <h1 style="margin:0 0 12px;font-size:20px">Seu código de verificação</h1>
      <p style="margin:0;color:#555;font-size:14px;line-height:1.5">Use o código abaixo para confirmar que é você no <b>Helpoint</b>.</p>
    </td></tr>
    <tr><td style="padding:20px 32px 28px">
      <p style="margin:0;font-size:28px;font-weight:700;letter-spacing:6px;color:#0073ea">{{ .Token }}</p>
      <p style="margin:24px 0 0;color:#999;font-size:12px;line-height:1.5">O código expira em pouco tempo. Se você não pediu este código, ignore esta mensagem.</p>
    </td></tr>
  </table>
</body>
</html>
